<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>自动滚动</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">↕</span>
        <div>
          <h1>自动滚动</h1>
          <p id="status">当前页面已停止</p>
        </div>
      </header>

      <section class="speed-card" aria-labelledby="speed-label">
        <div class="row">
          <label id="speed-label" for="speed">滚动速度</label>
          <div class="speed-input-wrap">
            <input id="speed-number" type="number" min="0" max="1000" step="0.5" value="10" aria-label="滚动速度数值" />
            <span>像素/秒</span>
          </div>
        </div>
        <input id="speed" type="range" min="0" max="120" step="0.5" value="10" />
        <div class="range-labels"><span>0</span><span>120</span></div>
      </section>

      <section class="interval-card">
        <label class="interval-toggle">
          <input id="interval-enabled" type="checkbox" />
          启用间歇滚动
        </label>
        <div id="interval-settings" class="interval-settings">
          <label>滚动 <input id="scroll-seconds" type="number" min="1" max="3600" step="1" value="20" /> 秒</label>
          <label>暂停 <input id="pause-seconds" type="number" min="1" max="3600" step="1" value="60" /> 秒</label>
        </div>
      </section>

      <fieldset>
        <legend>滚动方向</legend>
        <label><input type="radio" name="direction" value="1" checked /> 向下</label>
        <label><input type="radio" name="direction" value="-1" /> 向上</label>
      </fieldset>

      <button id="select-area" class="select" type="button">选择滚动区域</button>
      <p id="target-status">当前目标：整个网页</p>
      <button id="toggle" class="primary" type="button">开始滚动</button>
      <button id="stop-all" class="secondary" type="button">停止此页面</button>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
